finder_match_fg = "#58a6ff"
finder_selected_bg = "#1f6feb"
finder_selected_fg = "#ffffff"
finder_preview_bg = "#010409"

scrollbar_track = "#0d1117"
scrollbar_thumb = "#30363d"

[syntax]
keyword = "#ff7b72"
function = "#d2a8ff"
type = "#ffa657"
string = "#a5d6ff"
comment = "#8b949e"
number = "#79c0ff"
operator = "#ff7b72"
variable = "#e6edf3"
constant = "#79c0ff"
attribute = "#79c0ff"
tag = "#7ee787"
punctuation = "#e6edf3"
error = "#f85149"
