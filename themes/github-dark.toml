name = "GitHub Dark"
author = "edit-ng Team"
description = "Modern GitHub Dark default color theme"

[ui]
background = "#0d1117"
foreground = "#e6edf3"
cursor = "#58a6ff"
cursor_line = "#161b22"
selection = "#1f6feb"
line_number = "#484f58"
line_number_active = "#58a6ff"
gutter_bg = "#0d1117"

menu_bar_bg = "#161b22"
menu_bar_fg = "#e6edf3"
menu_selected_bg = "#1f6feb"
menu_selected_fg = "#ffffff"
menu_shortcut_fg = "#d29922"
menu_border = "#30363d"

status_bar_bg = "#010409"
status_bar_fg = "#8b949e"
status_bar_accent_bg = "#1f6feb"
status_bar_accent_fg = "#ffffff"

tab_active_bg = "#0d1117"
tab_active_fg = "#58a6ff"
tab_inactive_bg = "#010409"
tab_inactive_fg = "#484f58"
tab_modified = "#d29922"

dialog_bg = "#161b22"
dialog_fg = "#e6edf3"
dialog_border = "#30363d"
dialog_title = "#58a6ff"
dialog_input_bg = "#21262d"
dialog_input_fg = "#e6edf3"
dialog_button_bg = "#21262d"
dialog_button_fg = "#e6edf3"
dialog_button_active_bg = "#238636"
dialog_button_active_fg = "#ffffff"

search_match_bg = "#d29922"
search_match_fg = "#0d1117"
search_match_active_bg = "#ff7b72"
