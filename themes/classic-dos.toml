name = "Classic MS-DOS"
author = "edit-ng Team"
description = "Nostalgic blue & grey palette paying homage to classic MS-DOS Editor"

[ui]
background = "#0000aa"
foreground = "#ffffff"
cursor = "#ffff55"
cursor_line = "#000088"
selection = "#00aaaa"
line_number = "#5555ff"
line_number_active = "#ffff55"
gutter_bg = "#0000aa"

menu_bar_bg = "#aaaaaa"
menu_bar_fg = "#000000"
menu_selected_bg = "#0000aa"
menu_selected_fg = "#ffffff"
menu_shortcut_fg = "#aa0000"
menu_border = "#000000"

status_bar_bg = "#00aaaa"
status_bar_fg = "#000000"
status_bar_accent_bg = "#ffffff"
status_bar_accent_fg = "#0000aa"

tab_active_bg = "#0000aa"
tab_active_fg = "#ffffff"
tab_inactive_bg = "#aaaaaa"
tab_inactive_fg = "#000000"
tab_modified = "#ffff55"

dialog_bg = "#aaaaaa"
dialog_fg = "#000000"
dialog_border = "#000000"
dialog_title = "#0000aa"
dialog_input_bg = "#ffffff"
dialog_input_fg = "#000000"
dialog_button_bg = "#00aaaa"
dialog_button_fg = "#000000"
dialog_button_active_bg = "#0000aa"
dialog_button_active_fg = "#ffffff"

search_match_bg = "#ffff55"
search_match_fg = "#000000"
search_match_active_bg = "#ff5555"
search_match_active_fg = "#ffffff"

finder_bg = "#aaaaaa"
finder_fg = "#000000"
finder_border = "#0000aa"
