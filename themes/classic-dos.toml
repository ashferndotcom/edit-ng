finder_selected_bg = "#0000aa"
finder_selected_fg = "#ffffff"
finder_preview_bg = "#0000aa"

scrollbar_track = "#000088"
scrollbar_thumb = "#00aaaa"

[syntax]
keyword = "#ffff55"
function = "#55ffff"
type = "#55ff55"
string = "#ff55ff"
comment = "#5555ff"
number = "#ff5555"
operator = "#ffffff"
variable = "#ffffff"
constant = "#ffff55"
attribute = "#55ffff"
tag = "#ffff55"
punctuation = "#ffffff"
error = "#ff5555"
